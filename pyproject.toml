[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostdep"
version = "0.1.0"
description = "Catch AI package hallucinations and slopsquatting traps before you install or push."
readme = "README.md"
authors = [
    { name = "Nithinfgs", email = "nithinfgs@users.noreply.github.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
keywords = ["ai-agents", "hallucination", "security", "slopsquatting", "dependencies", "git-diff", "supply-chain"]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/Nithinfgs/ghostdep"
Repository = "https://github.com/Nithinfgs/ghostdep"
Issues = "https://github.com/Nithinfgs/ghostdep/issues"

[project.scripts]
ghostdep = "ghostdep.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostdep*"]
